services:
  pet:
    build: .
    image: shuiyuan-pet:phase1
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:3080:3080"
    volumes:
      - pet-data:/data
      - ./config/pet.json:/app/config/pet.json:ro
    secrets:
      - deepseek-api-key
      - discourse-profile.json
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "node", "/app/scripts/pet-control.mjs", "status"]
      interval: 30s
      timeout: 8s
      start_period: 45s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
secrets:
  deepseek-api-key:
    file: ./secrets/deepseek-api-key
  discourse-profile.json:
    file: ./secrets/discourse-profile.json
volumes:
  pet-data:
